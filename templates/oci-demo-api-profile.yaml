api_profile:
  version: "1"
  status: code-backed
  aip_informed: true
  aip_conformance_claimed: false
  contract:
    openapi_source: "docs/architecture/api/openapi-v1-baseline.json"
    base_path: "/api/v1"
    compatibility_policy: additive-with-deprecation-window
  resources:
    naming: plural-collections-opaque-identifiers
    standard_methods: [get, list, create, update, delete]
  query:
    supported_parameters: [page_size, page_token, filter, order_by, update_mask]
    page_size_max: 100
    filter_grammar: bounded-field-comparisons
  mutations:
    require_request_id: true
    idempotency: required-for-external-effects
    typed_body: required
  operations:
    enabled_for_async_or_side_effecting_actions: true
  security:
    principal_context: verified-authentication-only
    tenant_context: server-owned-verified-authentication-only
    authorization: resource-and-action-level-deny-by-default
    audit: redacted-decision-record-required
    redaction: required
    mcp_tools: typed-default-disabled-allowlist-fail-closed
  compatibility:
    consumer_inventory: required-before-retirement
    route_adapter: explicit-route-local-only
    deprecation_register: required
  evidence:
    required_before_release: [local_tests, authenticated_integration, approval]
